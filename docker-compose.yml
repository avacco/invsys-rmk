# Entorno local completo: PostgreSQL + API (perfil dev, con datos de demo).
# El frontend se levanta aparte con `npm run dev` (redirige /api a localhost:8080).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invsys}
      POSTGRES_USER: ${POSTGRES_USER:-invsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invsys_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-invsys}
      DB_USER: ${POSTGRES_USER:-invsys}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-invsys_dev}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/data/uploads

volumes:
  db-data:
  uploads:
