# Entorno de desarrollo local. Por ahora solo la base de datos;
# backend y frontend se suman en la fase 1.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invsys}
      POSTGRES_USER: ${POSTGRES_USER:-invsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invsys_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
