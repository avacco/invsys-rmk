name: Demo en GitHub Pages

# Publica el frontend en modo demo (backend simulado con MSW). No necesita servidor.
# Se ejecuta solo a mano (Actions → "Demo en GitHub Pages" → Run workflow).
# Para publicar automáticamente en cada push a main, agregar:
#   push:
#     branches: [main]
#     paths: ['frontend/**']
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages no tiene fallback para SPA: 404.html sirve la app en cualquier ruta.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
